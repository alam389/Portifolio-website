<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Valley — layered SVG parallax</title>
<style>
  /* ---------- palette: every color lives here ---------- */
  :root {
    /* sky: stepped fake-gradient, top -> horizon */
    --sky-1: #93C5E8;
    --sky-2: #9DCBEA;
    --sky-3: #A8D1EC;
    --sky-4: #B3D8EE;
    --sky-5: #BDDEF0;
    --sky-6: #C8E4F2;
    --sun-core: #FFD966;
    --sun-glow: #FFE9AC;
    --cloud: #FFFFFF;
    --cloud-shade: #DDEBF3;
    --star: transparent;            /* stars only appear at dusk */
    /* far mountains */
    --rock-far: #707A85;
    --rock: #5C6670;
    --snow: #EEF4F6;
    --snow-shade: #D6E2E8;
    /* near hills */
    --hill: #4A7C4E;
    --hill-light: #578E57;
    --hill-shade: #3D6A42;
    /* foreground */
    --fg: #2E5233;
    --fg-light: #6B9E4F;
    --fg-dark: #26452B;
    --trunk: #4F3A28;
    /* page chrome */
    --ink: #1F2A33;
    --panel: rgba(255, 255, 255, 0.55);
  }
  /* ---------- dusk / night override ---------- */
  [data-theme="dark"] {
    --sky-1: #0E1430;
    --sky-2: #131A3D;
    --sky-3: #1A234C;
    --sky-4: #232E5E;
    --sky-5: #2D3A6F;
    --sky-6: #3A4A80;
    --sun-core: #EDEDE0;            /* the sun becomes a moon */
    --sun-glow: #2A3560;
    --cloud: #39446B;
    --cloud-shade: #2E3857;
    --star: #E8EEF8;
    --rock-far: #3A4358;
    --rock: #303849;
    --snow: #B9C6DB;
    --snow-shade: #9DACC6;
    --hill: #274B3E;
    --hill-light: #31594A;
    --hill-shade: #1D3A30;
    --fg: #1B3325;
    --fg-light: #3C5F41;
    --fg-dark: #12241A;
    --trunk: #2A2019;
    --ink: #E8EEF8;
    --panel: rgba(10, 14, 32, 0.55);
  }

  * { margin: 0; box-sizing: border-box; }
  html { height: 100%; }
  body {
    /* tall page so there is something to scroll; bg matches the horizon so
       the sky layer's slow drift never reveals a hole */
    min-height: 320vh;
    background: var(--sky-6);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--ink);
  }

  /* ---------- stacking container + absolutely positioned layers ---------- */
  .parallax {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -1;
    background: var(--sky-6);
  }
  .parallax-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    will-change: transform;
  }

  /* ---------- page chrome ---------- */
  main { position: relative; }
  .card {
    width: fit-content;
    margin: 0 auto;
    padding: 20px 28px;
    background: var(--panel);
    border: 4px solid var(--ink);
    box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.25);
    text-align: center;
    backdrop-filter: blur(2px);
  }
  .card h1 { font-size: 28px; letter-spacing: 4px; text-transform: uppercase; }
  .card p { margin-top: 8px; font-size: 13px; letter-spacing: 1px; }
  .hero { padding-top: 12vh; }
  .mid { padding-top: 170vh; }
  #themeToggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 10;
    padding: 10px 14px;
    font: inherit;
    color: var(--ink);
    background: var(--panel);
    border: 4px solid var(--ink);
    box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.25);
    cursor: pointer;
  }
  #themeToggle:active { translate: 2px 2px; box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.25); }
</style>
</head>

    <section class="mid"><div class="card">

      <p>toggle the sun for dusk</p>
    </div></section>

  <button id="themeToggle" type="button" aria-label="Toggle day / dusk theme">&#9788; day</button>

<script>
  // ---------- theme: follow the OS initially, button toggles ----------
  var rootEl = document.documentElement;
  var toggleBtn = document.getElementById('themeToggle');
  function setTheme(dark) {
    if (dark) rootEl.setAttribute('data-theme', 'dark');
    else rootEl.removeAttribute('data-theme');
    toggleBtn.innerHTML = dark ? '&#9789; dusk' : '&#9788; day';
  }
  setTheme(window.matchMedia('(prefers-color-scheme: dark)').matches);
  toggleBtn.addEventListener('click', function () {
    setTheme(!rootEl.hasAttribute('data-theme'));
  });

  // ---------- parallax scroll handler (reduced-motion guarded) ----------
  (function () {
    var layers = Array.prototype.slice.call(document.querySelectorAll('.parallax-layer'));
    var motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    var ticking = false;

    function update() {
      var y = window.scrollY || window.pageYOffset;
      layers.forEach(function (layer) {
        var speed = parseFloat(layer.dataset.speed);
        // negative = layers drift upward as you scroll; the foreground (1.0)
        // moves with the page, the sky (0.1) barely moves
        layer.style.transform = 'translate3d(0, ' + (-y * speed).toFixed(1) + 'px, 0)';
      });
      ticking = false;
    }
    function onScroll() {
      if (!ticking) { requestAnimationFrame(update); ticking = true; }
    }
    function enable() {
      window.addEventListener('scroll', onScroll, { passive: true });
      update();
    }
    function disable() {
      window.removeEventListener('scroll', onScroll);
      layers.forEach(function (layer) { layer.style.transform = ''; });
    }

    if (!motionQuery.matches) enable();
    motionQuery.addEventListener('change', function (e) {
      if (e.matches) disable(); else enable();
    });
  })();
</script>
